name: Post Merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: publicauth-post-merge

jobs:
  tests:
    uses: ./.github/workflows/_run-tests.yml

  tag-release:
    needs:
      - tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@d2c103d4bb42d978f158ff2c1a664c3f6b581b99
