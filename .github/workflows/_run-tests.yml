name: Github Actions Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect secrets
        uses: govuk-pay/pay-ci/actions/detect-secrets@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa

  integration-tests:
    name: "Integration tests"
    uses: govuk-pay/pay-ci/.github/workflows/_run-java-tests-and-publish-pacts.yml@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa
    with:
      publish_pacts: false
      java_version: 25

  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@67c10bdec6dad03624cee4ab798578e1ea429b97

